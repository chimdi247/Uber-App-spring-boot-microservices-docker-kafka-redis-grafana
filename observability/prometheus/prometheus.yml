global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Application metrics (HTTP RED metrics, JVM, business KPIs) arrive via OTLP -> collector
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  # Containers (CPU / memory / network / restarts)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Host / node
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # MySQL (primary + replica) and ProxySQL (built-in exporter)
  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter-primary:9104"]
        labels: { role: primary }
      - targets: ["mysqld-exporter-replica:9104"]
        labels: { role: replica }

  - job_name: proxysql
    metrics_path: /metrics
    static_configs:
      - targets: ["proxysql:6070"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # ── Uptime / availability probes ──────────────────────────────
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://api-gateway:8080/actuator/health"]
        labels: { service: api-gateway }
      - targets: ["http://auth-service:8081/actuator/health"]
        labels: { service: auth-service }
      - targets: ["http://location-service:8082/actuator/health"]
        labels: { service: location-service }
      - targets: ["http://ride-service:8083/actuator/health"]
        labels: { service: ride-service }
      - targets: ["http://matching-service:8084/actuator/health"]
        labels: { service: matching-service }
      - targets: ["http://frontend/healthz"]
        labels: { service: frontend }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["mysql-primary:3306"]
        labels: { service: mysql-primary }
      - targets: ["mysql-replica:3306"]
        labels: { service: mysql-replica }
      - targets: ["proxysql:6033"]
        labels: { service: proxysql }
      - targets: ["redis:6379"]
        labels: { service: redis }
      - targets: ["kafka:29092"]
        labels: { service: kafka }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
